---
- name: Deploy DevOps consulting stack to an on-premise Linux server
  hosts: onprem
  become: true
  gather_facts: true

  vars:
    project_dir: /opt/devops-consulting-springboot
    local_project_root: "{{ playbook_dir }}/../.."
    vault_file: "{{ playbook_dir }}/vault.yml"
    docker_apt_arch: "{{ 'amd64' if ansible_architecture == 'x86_64' else 'arm64' if ansible_architecture in ['aarch64', 'arm64'] else ansible_architecture }}"
    deploy_user: "{{ ansible_env.SUDO_USER | default(ansible_user_id) }}"
    deploy_group: "{{ ansible_env.SUDO_USER | default(ansible_user_id) }}"
    deploy_home: "{{ '/root' if deploy_user == 'root' else '/home/' ~ deploy_user }}"
    app_image: "consulting-orders-api:local"
    app_http_port: "8080"
    app_direct_port: "8081"
    postgres_port: "5432"
    observability_bind_addr: "127.0.0.1"
    grafana_port: "3000"
    prometheus_port: "9090"
    alertmanager_port: "9093"
    loki_port: "3100"
    prometheus_retention_time: "7d"
    docker_log_max_size: "10m"
    docker_log_max_file: "3"
    backup_retention_days: "7"
    backup_sync_dir: ""
    backup_remote_enabled: "false"
    backup_remote_host: ""
    backup_remote_user: ""
    backup_remote_port: "22"
    backup_remote_dir: ""
    backup_remote_ssh_key: ""
    backup_remote_strict_host_key_checking: "yes"
    backup_remote_rsync_delete: "false"
    file_backup_source_dir: ""
    backup_timer_enabled: true
    backup_schedule: "*-*-* 03:00:00"
    backup_randomized_delay_sec: "10m"
    smoke_test_attempts: "20"
    smoke_test_sleep_seconds: "3"
    alert_local_webhook_url: ""
    alert_discord_webhook_url: ""
    alert_slack_webhook_url: ""
    alert_slack_channel: ""
    postgres_user: ""
    postgres_password: ""
    grafana_admin_user: ""
    grafana_admin_password: ""

  tasks:
    - name: Check optional Ansible Vault file
      ansible.builtin.stat:
        path: "{{ vault_file }}"
      register: onprem_vault_file
      delegate_to: localhost
      become: false

    - name: Load Ansible Vault variables
      ansible.builtin.include_vars:
        file: "{{ vault_file }}"
      when: onprem_vault_file.stat.exists
      no_log: true

    - name: Validate required secret values
      ansible.builtin.assert:
        that:
          - postgres_user | length > 0
          - postgres_password | length > 0
          - grafana_admin_user | length > 0
          - grafana_admin_password | length > 0
        fail_msg: "Create infra/onprem/vault.yml from vault.example.yml, fill real secrets, encrypt it with ansible-vault, then run this playbook with --ask-vault-pass."
        success_msg: "Required deployment secrets are loaded."
      no_log: true

    - name: Fail when target OS is not Debian family
      ansible.builtin.fail:
        msg: "This playbook currently supports Debian/Ubuntu on-premise servers."
      when: ansible_os_family != "Debian"

    - name: Install base packages for Docker repository
      ansible.builtin.apt:
        name:
          - ca-certificates
          - curl
          - git
          - gnupg
          - openssh-client
          - rsync
        state: present
        update_cache: true

    - name: Create apt keyring directory
      ansible.builtin.file:
        path: /etc/apt/keyrings
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Download Docker apt repository key
      ansible.builtin.get_url:
        url: https://download.docker.com/linux/ubuntu/gpg
        dest: /etc/apt/keyrings/docker.asc
        owner: root
        group: root
        mode: "0644"

    - name: Add Docker apt repository
      ansible.builtin.apt_repository:
        repo: "deb [arch={{ docker_apt_arch }} signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable"
        filename: docker
        state: present
        update_cache: true

    - name: Install Docker Engine and Compose plugin
      ansible.builtin.apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-buildx-plugin
          - docker-compose-plugin
        state: present

    - name: Ensure Docker service is running
      ansible.builtin.service:
        name: docker
        state: started
        enabled: true

    - name: Allow deploy user to run Docker commands
      ansible.builtin.user:
        name: "{{ deploy_user }}"
        groups: docker
        append: true

    - name: Verify Docker Compose plugin
      ansible.builtin.command:
        cmd: docker compose version
      changed_when: false

    - name: Create project directory
      ansible.builtin.file:
        path: "{{ project_dir }}"
        state: directory
        owner: "{{ deploy_user }}"
        group: "{{ deploy_group }}"
        mode: "0755"

    - name: Copy project files to target server
      ansible.builtin.copy:
        src: "{{ local_project_root }}/"
        dest: "{{ project_dir }}/"
        owner: "{{ deploy_user }}"
        group: "{{ deploy_group }}"
        mode: preserve

    - name: Remove local-only Ansible Vault file from target copy
      ansible.builtin.file:
        path: "{{ project_dir }}/infra/onprem/vault.yml"
        state: absent

    - name: Write environment file for on-premise deployment
      ansible.builtin.copy:
        dest: "{{ project_dir }}/.env"
        owner: "{{ deploy_user }}"
        group: "{{ deploy_group }}"
        mode: "0600"
        content: |
          APP_IMAGE={{ app_image }}
          HTTP_PORT={{ app_http_port }}
          APP_PORT={{ app_direct_port }}
          POSTGRES_PORT={{ postgres_port }}
          OBSERVABILITY_BIND_ADDR={{ observability_bind_addr }}
          GRAFANA_PORT={{ grafana_port }}
          PROMETHEUS_PORT={{ prometheus_port }}
          ALERTMANAGER_PORT={{ alertmanager_port }}
          LOKI_PORT={{ loki_port }}
          PROMETHEUS_RETENTION_TIME={{ prometheus_retention_time }}
          DOCKER_LOG_MAX_SIZE={{ docker_log_max_size }}
          DOCKER_LOG_MAX_FILE={{ docker_log_max_file }}
          BACKUP_RETENTION_DAYS={{ backup_retention_days }}
          BACKUP_SYNC_DIR={{ backup_sync_dir }}
          BACKUP_REMOTE_ENABLED={{ backup_remote_enabled }}
          BACKUP_REMOTE_HOST={{ backup_remote_host }}
          BACKUP_REMOTE_USER={{ backup_remote_user }}
          BACKUP_REMOTE_PORT={{ backup_remote_port }}
          BACKUP_REMOTE_DIR={{ backup_remote_dir }}
          BACKUP_REMOTE_SSH_KEY={{ backup_remote_ssh_key }}
          BACKUP_REMOTE_STRICT_HOST_KEY_CHECKING={{ backup_remote_strict_host_key_checking }}
          BACKUP_REMOTE_RSYNC_DELETE={{ backup_remote_rsync_delete }}
          FILE_BACKUP_SOURCE_DIR={{ file_backup_source_dir }}
          SMOKE_TEST_ATTEMPTS={{ smoke_test_attempts }}
          SMOKE_TEST_SLEEP_SECONDS={{ smoke_test_sleep_seconds }}
          POSTGRES_USER={{ postgres_user }}
          POSTGRES_PASSWORD={{ postgres_password }}
          GRAFANA_ADMIN_USER={{ grafana_admin_user }}
          GRAFANA_ADMIN_PASSWORD={{ grafana_admin_password }}
          ALERT_LOCAL_WEBHOOK_URL={{ alert_local_webhook_url }}
          ALERT_DISCORD_WEBHOOK_URL={{ alert_discord_webhook_url }}
          ALERT_SLACK_WEBHOOK_URL={{ alert_slack_webhook_url }}
          ALERT_SLACK_CHANNEL={{ alert_slack_channel }}
      no_log: true

    - name: Create ssh directory for backup sync
      ansible.builtin.file:
        path: "{{ deploy_home }}/.ssh"
        state: directory
        owner: "{{ deploy_user }}"
        group: "{{ deploy_group }}"
        mode: "0700"
      when:
        - backup_remote_enabled | lower in ["true", "yes", "1"]
        - backup_remote_host | length > 0

    - name: Scan backup server host key
      ansible.builtin.command:
        cmd: "ssh-keyscan -T 5 -p {{ backup_remote_port }} {{ backup_remote_host }}"
      register: backup_remote_known_hosts
      changed_when: false
      when:
        - backup_remote_enabled | lower in ["true", "yes", "1"]
        - backup_remote_host | length > 0

    - name: Trust backup server host key for deploy user
      ansible.builtin.lineinfile:
        path: "{{ deploy_home }}/.ssh/known_hosts"
        line: "{{ item }}"
        create: true
        owner: "{{ deploy_user }}"
        group: "{{ deploy_group }}"
        mode: "0644"
        state: present
      loop: "{{ backup_remote_known_hosts.stdout_lines }}"
      when:
        - backup_remote_enabled | lower in ["true", "yes", "1"]
        - backup_remote_known_hosts.stdout_lines | length > 0

    - name: Configure Alertmanager receiver
      ansible.builtin.command:
        cmd: ./ops/configure-alertmanager.sh
        chdir: "{{ project_dir }}"
      environment:
        ENV_FILE: .env
      become_user: "{{ deploy_user }}"
      register: alertmanager_config
      changed_when: "'changed=true' in alertmanager_config.stdout"

    - name: Build and start the stack
      ansible.builtin.command:
        cmd: docker compose up -d --build
        chdir: "{{ project_dir }}"
      changed_when: true

    - name: Install scheduled PostgreSQL backup timer
      ansible.builtin.command:
        cmd: ./ops/install-backup-timer.sh
        chdir: "{{ project_dir }}"
      environment:
        PROJECT_DIR: "{{ project_dir }}"
        RUN_USER: "{{ deploy_user }}"
        RUN_GROUP: "{{ deploy_group }}"
        BACKUP_SCHEDULE: "{{ backup_schedule }}"
        BACKUP_RANDOMIZED_DELAY_SEC: "{{ backup_randomized_delay_sec }}"
      register: backup_timer_install
      changed_when: "'changed=true' in backup_timer_install.stdout"
      when: backup_timer_enabled | bool

    - name: Show running containers
      ansible.builtin.command:
        cmd: docker compose ps
        chdir: "{{ project_dir }}"
      register: compose_ps
      changed_when: false

    - name: Print deployment result
      ansible.builtin.debug:
        var: compose_ps.stdout_lines
