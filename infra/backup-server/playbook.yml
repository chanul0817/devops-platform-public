---
- name: Prepare a Linux backup server for rsync over SSH
  hosts: backup
  become: true
  gather_facts: true

  vars:
    backup_user: devopsbackup
    backup_root: /srv/backups/devops-platform
    backup_ssh_public_key: ""
    standby_enabled: false
    standby_deploy_user: "{{ ansible_env.SUDO_USER | default(ansible_user_id) }}"
    standby_project_dir: /opt/devops-postgres-standby
    docker_apt_arch: "{{ 'amd64' if ansible_architecture == 'x86_64' else 'arm64' if ansible_architecture in ['aarch64', 'arm64'] else ansible_architecture }}"

  tasks:
    - name: Fail when target OS is not Debian family
      ansible.builtin.fail:
        msg: "This playbook currently supports Debian/Ubuntu backup servers."
      when: ansible_os_family != "Debian"

    - name: Install backup server packages
      ansible.builtin.apt:
        name:
          - ca-certificates
          - curl
          - gnupg
          - rsync
          - openssh-server
        state: present
        update_cache: true

    - name: Ensure ssh service is running
      ansible.builtin.service:
        name: ssh
        state: started
        enabled: true

    - name: Create backup user
      ansible.builtin.user:
        name: "{{ backup_user }}"
        shell: /bin/bash
        create_home: true

    - name: Create backup directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: "{{ backup_user }}"
        group: "{{ backup_user }}"
        mode: "0750"
      loop:
        - "{{ backup_root }}"
        - "{{ backup_root }}/db"
        - "{{ backup_root }}/files"
        - "{{ backup_root }}/files/current"

    - name: Create ssh directory for backup user
      ansible.builtin.file:
        path: "/home/{{ backup_user }}/.ssh"
        state: directory
        owner: "{{ backup_user }}"
        group: "{{ backup_user }}"
        mode: "0700"
      when: backup_ssh_public_key | length > 0

    - name: Install app server public key for backup user
      ansible.builtin.lineinfile:
        path: "/home/{{ backup_user }}/.ssh/authorized_keys"
        line: "{{ backup_ssh_public_key }}"
        create: true
        owner: "{{ backup_user }}"
        group: "{{ backup_user }}"
        mode: "0600"
        state: present
      when: backup_ssh_public_key | length > 0

    - name: Create apt keyring directory for Docker
      ansible.builtin.file:
        path: /etc/apt/keyrings
        state: directory
        owner: root
        group: root
        mode: "0755"
      when: standby_enabled | bool

    - name: Download Docker apt repository key
      ansible.builtin.get_url:
        url: https://download.docker.com/linux/ubuntu/gpg
        dest: /etc/apt/keyrings/docker.asc
        owner: root
        group: root
        mode: "0644"
      when: standby_enabled | bool

    - name: Add Docker apt repository
      ansible.builtin.apt_repository:
        repo: "deb [arch={{ docker_apt_arch }} signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable"
        filename: docker
        state: present
        update_cache: true
      when: standby_enabled | bool

    - name: Install Docker Engine and Compose plugin for standby DB
      ansible.builtin.apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-buildx-plugin
          - docker-compose-plugin
        state: present
      when: standby_enabled | bool

    - name: Ensure Docker service is running for standby DB
      ansible.builtin.service:
        name: docker
        state: started
        enabled: true
      when: standby_enabled | bool

    - name: Allow standby deploy user to run Docker commands
      ansible.builtin.user:
        name: "{{ standby_deploy_user }}"
        groups: docker
        append: true
      when: standby_enabled | bool

    - name: Create standby PostgreSQL project directory
      ansible.builtin.file:
        path: "{{ standby_project_dir }}"
        state: directory
        owner: "{{ standby_deploy_user }}"
        group: "{{ standby_deploy_user }}"
        mode: "0750"
      when: standby_enabled | bool

    - name: Verify Docker Compose plugin for standby DB
      ansible.builtin.command:
        cmd: docker compose version
      changed_when: false
      when: standby_enabled | bool

    - name: Print backup server result
      ansible.builtin.debug:
        msg:
          - "Backup root: {{ backup_root }}"
          - "Backup user: {{ backup_user }}"
          - "Standby enabled: {{ standby_enabled }}"
          - "Standby project dir: {{ standby_project_dir if standby_enabled | bool else 'disabled' }}"
          - "Configure the app server with BACKUP_REMOTE_USER, BACKUP_REMOTE_HOST, BACKUP_REMOTE_DIR, and BACKUP_REMOTE_SSH_KEY."
