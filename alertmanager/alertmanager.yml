global:
  resolve_timeout: 5m

route:
  receiver: default-webhook
  group_by:
    - alertname
    - service
  group_wait: 15s
  group_interval: 1m
  repeat_interval: 3h

receivers:
  - name: default-webhook
    webhook_configs:
      - url: http://host.docker.internal:9099/alerts
        send_resolved: true
