name: Deploy to On-premise Server

on:
  workflow_dispatch:
    inputs:
      target_environment:
        description: Target deployment environment
        required: true
        default: production
        type: choice
        options:
          - staging
          - production
  workflow_run:
    workflows:
      - CI
    types:
      - completed
    branches:
      - main

concurrency:
  group: onprem-${{ github.event.inputs.target_environment || 'production' }}-deploy
  cancel-in-progress: false

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/consulting-orders-api

jobs:
  build-and-push:
    name: Build and push image
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    permissions:
      contents: read
      packages: write
    outputs:
      image_tag: ${{ steps.meta.outputs.image_tag }}
      deploy_sha: ${{ steps.meta.outputs.deploy_sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

      - name: Set image tag
        id: meta
        run: |
          DEPLOY_SHA="${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}"
          echo "deploy_sha=${DEPLOY_SHA}" >> "$GITHUB_OUTPUT"
          echo "image_tag=${IMAGE_NAME}:${DEPLOY_SHA}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./app
          push: true
          tags: ${{ steps.meta.outputs.image_tag }}

  deploy:
    name: Deploy from on-premise self-hosted runner
    runs-on: [self-hosted, Linux, onprem]
    needs: build-and-push
    if: ${{ needs.build-and-push.result == 'success' }}
    environment: ${{ github.event.inputs.target_environment || 'production' }}
    env:
      TARGET_ENVIRONMENT: ${{ github.event.inputs.target_environment || 'production' }}
      ONPREM_DEPLOY_DIR: ${{ secrets.ONPREM_DEPLOY_DIR }}
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout delivery package
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.build-and-push.outputs.deploy_sha }}

      - name: Check deploy runner prerequisites
        run: |
          DEPLOY_DIR="${ONPREM_DEPLOY_DIR:-/opt/devops-consulting-springboot}"
          echo "Target environment: ${TARGET_ENVIRONMENT}"
          echo "Deploy directory: ${DEPLOY_DIR}"

          command -v rsync
          docker compose version

          if [ ! -d "${DEPLOY_DIR}" ]; then
            echo "::error::Deploy directory does not exist: ${DEPLOY_DIR}. Run the Ansible bootstrap playbook first."
            exit 1
          fi

          if [ ! -w "${DEPLOY_DIR}" ]; then
            echo "::error::Deploy directory is not writable by the self-hosted runner user: ${DEPLOY_DIR}"
            exit 1
          fi

      - name: Sync delivery package files
        run: |
          DEPLOY_DIR="${ONPREM_DEPLOY_DIR:-/opt/devops-consulting-springboot}"

          rsync -az --delete \
            --exclude '.git/' \
            --exclude '.github/' \
            --exclude '.env' \
            --exclude 'app/build/' \
            --exclude '**/.gradle/' \
            ./ "${DEPLOY_DIR}/"

      - name: Deploy locally
        run: |
          DEPLOY_DIR="${ONPREM_DEPLOY_DIR:-/opt/devops-consulting-springboot}"
          IMAGE_TAG="${{ needs.build-and-push.outputs.image_tag }}"

          cd "${DEPLOY_DIR}"

          echo '${{ secrets.GITHUB_TOKEN }}' | docker login ghcr.io -u '${{ github.actor }}' --password-stdin
          IMAGE_TAG="${IMAGE_TAG}" ./ops/deploy-image.sh
