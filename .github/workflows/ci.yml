name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    name: Test Spring Boot app
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run tests in Gradle container
        run: |
          docker run --rm \
            -v "$PWD/app:/workspace" \
            -w /workspace \
            gradle:8-jdk17-alpine \
            gradle test --no-daemon

  docker-build:
    name: Build Docker image
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image without push
        uses: docker/build-push-action@v6
        with:
          context: ./app
          push: false
          tags: consulting-orders-api:ci
