x-default-logging: &default-logging
  driver: json-file
  options:
    max-size: "${DOCKER_LOG_MAX_SIZE:-10m}"
    max-file: "${DOCKER_LOG_MAX_FILE:-3}"

services:
  nginx:
    image: nginx:1.27-alpine
    container_name: ${CONTAINER_NAME_PREFIX:-consulting}-nginx
    restart: unless-stopped
    cpus: "0.25"
    mem_limit: 128m
    logging: *default-logging
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "${HTTP_PORT:-8080}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - consulting

  app:
    image: ${APP_IMAGE:-consulting-orders-api:local}
    build:
      context: ./app
    container_name: ${CONTAINER_NAME_PREFIX:-consulting}-springboot-app
    restart: unless-stopped
    cpus: "1.00"
    mem_limit: 768m
    logging: *default-logging
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/orders
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:?POSTGRES_USER is required}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-local}
      DEPLOY_ENV: ${DEPLOY_ENV:-local}
      LOG_FILE: /logs/application.log
    ports:
      - "127.0.0.1:${APP_PORT:-8081}:8080"
    volumes:
      - app-logs:/logs
    healthcheck:
      test: ["CMD-SHELL", "ps | grep '[j]ava' >/dev/null"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 40s
    networks:
      - consulting

  postgres:
    image: postgres:16-alpine
    container_name: ${CONTAINER_NAME_PREFIX:-consulting}-postgres
    restart: unless-stopped
    cpus: "1.00"
    mem_limit: 1g
    logging: *default-logging
    environment:
      POSTGRES_DB: orders
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d orders"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - consulting

  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: ${CONTAINER_NAME_PREFIX:-consulting}-prometheus
    restart: unless-stopped
    cpus: "0.50"
    mem_limit: 768m
    logging: *default-logging
    depends_on:
      app:
        condition: service_healthy
      alertmanager:
        condition: service_started
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=${PROMETHEUS_RETENTION_TIME:-7d}"
      - "--web.enable-lifecycle"
    ports:
      - "${OBSERVABILITY_BIND_ADDR:-127.0.0.1}:${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alert-rules.yml:/etc/prometheus/alert-rules.yml:ro
      - prometheus-data:/prometheus
    networks:
      - consulting

  grafana:
    image: grafana/grafana:11.4.0
    container_name: ${CONTAINER_NAME_PREFIX:-consulting}-grafana
    restart: unless-stopped
    cpus: "0.50"
    mem_limit: 512m
    logging: *default-logging
    depends_on:
      prometheus:
        condition: service_started
      loki:
        condition: service_started
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:?GRAFANA_ADMIN_USER is required}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD is required}
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports:
      - "${OBSERVABILITY_BIND_ADDR:-127.0.0.1}:${GRAFANA_PORT:-3000}:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    networks:
      - consulting

  loki:
    image: grafana/loki:3.3.2
    container_name: ${CONTAINER_NAME_PREFIX:-consulting}-loki
    restart: unless-stopped
    cpus: "0.50"
    mem_limit: 512m
    logging: *default-logging
    command: ["-config.file=/etc/loki/local-config.yml"]
    ports:
      - "${OBSERVABILITY_BIND_ADDR:-127.0.0.1}:${LOKI_PORT:-3100}:3100"
    volumes:
      - ./logging/loki-config.yml:/etc/loki/local-config.yml:ro
      - loki-data:/loki
    networks:
      - consulting

  promtail:
    image: grafana/promtail:3.3.2
    container_name: ${CONTAINER_NAME_PREFIX:-consulting}-promtail
    restart: unless-stopped
    cpus: "0.25"
    mem_limit: 128m
    logging: *default-logging
    depends_on:
      app:
        condition: service_healthy
      loki:
        condition: service_started
    command: ["-config.file=/etc/promtail/config.yml"]
    volumes:
      - ./logging/promtail-config.yml:/etc/promtail/config.yml:ro
      - app-logs:/var/log/app:ro
    networks:
      - consulting

  alertmanager:
    image: prom/alertmanager:v0.28.0
    container_name: ${CONTAINER_NAME_PREFIX:-consulting}-alertmanager
    restart: unless-stopped
    cpus: "0.25"
    mem_limit: 128m
    logging: *default-logging
    command:
      - "--config.file=/etc/alertmanager/alertmanager.yml"
      - "--storage.path=/alertmanager"
    ports:
      - "${OBSERVABILITY_BIND_ADDR:-127.0.0.1}:${ALERTMANAGER_PORT:-9093}:9093"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager-data:/alertmanager
    networks:
      - consulting

networks:
  consulting:

volumes:
  postgres-data:
  prometheus-data:
  grafana-data:
  loki-data:
  alertmanager-data:
  app-logs:
