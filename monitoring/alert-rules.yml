groups:
  - name: spring-boot-availability
    rules:
      - alert: SpringBootAppDown
        expr: up{job="spring-boot-app"} == 0
        for: 1m
        labels:
          severity: critical
          service: consulting-orders-api
        annotations:
          summary: "Spring Boot API is down"
          description: "Prometheus could not scrape the Spring Boot application for more than 1 minute."

      - alert: HighHttp5xxRate
        expr: sum(rate(http_server_requests_seconds_count{status=~"5.."}[2m])) > 0
        for: 1m
        labels:
          severity: warning
          service: consulting-orders-api
        annotations:
          summary: "HTTP 5xx responses detected"
          description: "The application returned one or more 5xx responses in the last 2 minutes."

      - alert: HighJvmHeapUsage
        expr: |
          sum(jvm_memory_used_bytes{job="spring-boot-app", area="heap"})
          /
          sum(jvm_memory_max_bytes{job="spring-boot-app", area="heap"})
          > 0.8
        for: 3m
        labels:
          severity: warning
          service: consulting-orders-api
        annotations:
          summary: "JVM heap usage is high"
          description: "JVM heap usage has been above 80% for more than 3 minutes."
